
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-ai"
version = "0.1.0"
description = "Evidence-first AI research and fact-checking agent"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "requests>=2.32,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
